<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body style="background: radial-gradient(circle, #ffe2bd 0%, #f5cda1 80%);">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg" 
       style="width:90%; margin:20px auto; border-radius:50px;
              background:linear-gradient(90deg,#f5e6d3,#ffffff);
              box-shadow:0 4px 20px rgba(0,0,0,0.2); ">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" style="color: #7e5022;" href="images/Nada's img.png">NADA ALAWNEH</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li><a href="index.html" class="btn ms-3" 
           style="border:1px solid #a67c52; color: #7e5022;; border-radius:30px; background: linear-gradient(90deg, #eecba6, #d8c5b2);">
           Home
          </a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contact Section -->
  <section class="contact-section">
    <div class="contact-left">
      <br><h1>Let's Build Something Great!</h1><br>
      <p>Looking for a web developer to bring your ideas to life?
      Fill out the form and let's discuss your project goals.</p><br><br>

      <div class="contact-info">
        <p>
          <a href="mailto:nadaalawneh504@gmail.com" target="_blank">
            <i class="fa-solid fa-envelope"></i> Email: nadaalawneh504@gmail.com
          </a>
        </p>
        <p>
          <a href="https://www.google.com/maps/place/Irbid,+Jordan" target="_blank">
            <i class="fa-solid fa-location-dot"></i> Location: Irbid, Jordan
          </a>
        </p>
        <p>
          <a href="https://wa.me/962772721010" target="_blank">
            <i class="fa-solid fa-globe"></i> Available for Remote Work
          </a>
        </p>
      </div>
    </div>

    <div class="contact-right">
      <form>
        <label>Full Name</label>
        <input type="text" placeholder="e.g. John Doe">

        <label>Email</label>
        <input type="email" placeholder="e.g. john@example.com">

        <label>Project Type</label>
        <select>
          <option>Portfolio Website</option>
          <option>Business Website</option>
          <option>Web App</option>
        </select>

        <label>Budget Range</label>
        <select>
          <option>$100 - $300</option>
          <option>$300 - $600</option>
          <option>$600+</option>
        </select>

        <label>Project Description</label>
        <textarea placeholder="Briefly describe your project..."></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="Footer">
    <p>© 2026 Nada Alawneh | All Rights Reserved</p>
  </footer>

</body>
</html>
